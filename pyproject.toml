[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sp-mcp"
version = "0.6.0"
description = "MCP server for Substance 3D Painter"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-requests",
]

[project.scripts]
sp-mcp = "server.sp_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["server", "plugin"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true   # substance_painter.* 不在外部环境里

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires Painter running with bridge on :27182",
]
testpaths = ["tests"]
